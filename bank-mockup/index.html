<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="manifest.webmanifest" /><link rel="icon" href="icon-192.png" /><link rel="apple-touch-icon" href="icon-192.png" /><meta name="theme-color" content="#000000" /><title>Мобильный банк — Главная</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter (Cyrillic subset) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&subset=cyrillic&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-outer: #000000;
      --bg-app: #0B0B0D;
      --bg-sheet: #1C1B1F;
      --bg-card-elevated: #242329;
      --bg-chart: #302826;
      --bar-rose: #B5867B;
      --accent-purple: #9E8DF2;
      --accent-purple-dim: rgba(158, 141, 242, 0.16);
      --text-primary: #F2F1F5;
      --text-secondary: #88868E;
      --border-subtle: #2E2D33;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-outer);
      color: var(--text-primary);
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-variant-numeric: tabular-nums;
    }

    /* Custom Kyrgyzstani Som symbol (lowercase sans-serif 'с' + crisp horizontal underline bar) */
    .som {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.95;
      font-weight: inherit;
      vertical-align: baseline;
    }

    .som::after {
      content: "";
      display: block;
      width: 100%;
      height: 1.7px;
      background-color: currentColor;
      margin-top: 1.5px;
      border-radius: 0.5px;
    }

    .som-sm {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.95;
      font-weight: inherit;
      vertical-align: baseline;
    }

    .som-sm::after {
      content: "";
      display: block;
      width: 100%;
      height: 1.3px;
      background-color: currentColor;
      margin-top: 1.2px;
      border-radius: 0.5px;
    }

    /* Hide scrollbars cleanly while keeping native touch scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Desktop phone frame vs full-bleed mobile */
    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      height: 100dvh;
      background-color: var(--bg-app);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 500px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
      }
      .app-shell {
        height: min(880px, 95dvh);
        min-height: 0;
        border-radius: 38px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
    }

    /* Collapsible Quick Actions & Virtual Card Transition */
    .quick-actions-wrapper {
      overflow: hidden;
      transition: max-height 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.26s ease,
                  transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                  margin 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 220px;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .quick-actions-wrapper.collapsed {
      max-height: 0px;
      opacity: 0;
      transform: translateY(-14px) scale(0.96);
      pointer-events: none;
    }

    .page-dots-wrapper {
      transition: max-height 0.28s ease, opacity 0.22s ease, margin 0.28s ease;
      max-height: 28px;
      opacity: 1;
      overflow: hidden;
    }

    .page-dots-wrapper.collapsed {
      max-height: 0px;
      opacity: 0;
      margin: 0 !important;
    }

    .balance-header {
      transition: padding 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Floating Glass Bottom Navigation Bar */
    .floating-nav {
      background: linear-gradient(180deg, rgba(46, 45, 53, 0.82) 0%, rgba(28, 27, 32, 0.92) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .nav-pill-active {
      background: radial-gradient(circle at 50% 35%, rgba(158, 141, 242, 0.26) 0%, rgba(255, 255, 255, 0.05) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Transaction Detail Screen Slide Transition */
    .detail-screen {
      position: absolute;
      inset: 0;
      background-color: var(--bg-app);
      z-index: 40;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .detail-screen.open {
      transform: translateX(0);
    }

    /* Bottom Sheet Modal Backdrop & Drawer */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(4px);
      z-index: 55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      background: #1E1D23;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 20px 30px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    /* Dotted Grid Lines in Chart */
    .chart-grid-line {
      border-bottom: 1.5px dotted rgba(255, 255, 255, 0.14);
    }

    /* Chart Bar Animation */
    .chart-bar {
      transition: height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Subtle button press feedback */
    .pressable {
      transition: transform 0.14s ease, opacity 0.14s ease, background-color 0.15s ease;
    }
    .pressable:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- Mobile App Container -->
  <div class="app-shell" id="appShell">

    <!-- ==================== MAIN SCREEN ('Главная') ==================== -->
    <main id="mainTabContent" class="flex-1 flex flex-col overflow-hidden relative">

      <!-- Top Account Balance & Collapsible Quick Actions -->
      <section class="px-5 pt-5 shrink-0 select-none z-10">
        <!-- 3 Carousel Dots (3rd active purple) -->
        <div id="pageDotsWrapper" class="page-dots-wrapper flex items-center justify-center gap-2 mt-1 mb-4">
          <button onclick="switchAccountSlide(0)" class="account-dot w-1.5 h-1.5 rounded-full bg-[#383640] transition-colors" aria-label="Счет 1"></button>
          <button onclick="switchAccountSlide(1)" class="account-dot w-1.5 h-1.5 rounded-full bg-[#383640] transition-colors" aria-label="Счет 2"></button>
          <button onclick="switchAccountSlide(2)" class="account-dot w-1.5 h-1.5 rounded-full bg-[#9E8DF2] transition-colors" aria-label="Основной счет"></button>
        </div>

        <!-- Main Balance Display -->
        <div id="balanceHeader" class="balance-header text-center pb-4 cursor-pointer" onclick="expandHeader()" title="Нажмите, чтобы развернуть меню">
          <div id="accountTitleBadge" class="hidden text-[11px] text-[#88868E] mb-0.5 font-medium"></div>
          <div class="inline-flex items-baseline justify-center text-white">
            <span id="balanceInteger" class="text-[42px] font-medium leading-none tracking-[-0.02em]">8 680</span>
            <span id="balanceFraction" class="text-[24px] font-medium leading-none ml-0.5">,99</span>
            <span class="text-[24px] font-medium leading-none ml-2"><span class="som">с</span></span>
          </div>
        </div>

        <!-- Collapsible Quick Actions + Peeking Virtual VISA Card -->
        <div id="quickActionsWrapper" class="quick-actions-wrapper">
          <!-- 3 Quick Action Buttons -->
          <div class="grid grid-cols-3 gap-3 px-2 pt-1 pb-5">
            <!-- Top up -->
            <button onclick="openActionModal('topup')" class="pressable flex flex-col items-center gap-2.5 group">
              <div class="w-[56px] h-[56px] rounded-full bg-[#9E8DF2] flex items-center justify-center shadow-lg shadow-[#9E8DF2]/15">
                <svg class="w-6 h-6 text-[#111115]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
              </div>
              <span class="text-[12.5px] leading-[1.25] text-[#F2F1F5] text-center font-normal">Пополнить<br/>свою карту</span>
            </button>

            <!-- Transfer -->
            <button onclick="openActionModal('transfer')" class="pressable flex flex-col items-center gap-2.5 group">
              <div class="w-[56px] h-[56px] rounded-full bg-[#9E8DF2] flex items-center justify-center shadow-lg shadow-[#9E8DF2]/15">
                <svg class="w-6 h-6 text-[#111115]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
              </div>
              <span class="text-[12.5px] leading-[1.25] text-[#F2F1F5] text-center font-normal">Перевести<br/>на карту</span>
            </button>

            <!-- QR Payment -->
            <button onclick="openActionModal('qr')" class="pressable flex flex-col items-center gap-2.5 group">
              <div class="w-[56px] h-[56px] rounded-full bg-[#9E8DF2] flex items-center justify-center shadow-lg shadow-[#9E8DF2]/15">
                <svg class="w-6 h-6 text-[#111115]" viewBox="0 0 24 24" fill="currentColor">
                  <!-- Top-left hollow finder square -->
                  <path d="M3 3h7v7H3V3zm2 2v3h3V5H5z"/>
                  <!-- Top-right hollow finder square -->
                  <path d="M14 3h7v7h-7V3zm2 2v3h3V5h-3z"/>
                  <!-- Bottom-left hollow finder square -->
                  <path d="M3 14h7v7H3v-7zm2 2v3h3v-3H5z"/>
                  <!-- Bottom-right QR data modules -->
                  <rect x="14" y="14" width="2.5" height="2.5"/>
                  <rect x="18.5" y="14" width="2.5" height="2.5"/>
                  <rect x="16.25" y="16.25" width="2.5" height="2.5"/>
                  <rect x="14" y="18.5" width="2.5" height="2.5"/>
                  <rect x="18.5" y="18.5" width="2.5" height="2.5"/>
                </svg>
              </div>
              <span class="text-[12.5px] leading-[1.25] text-[#F2F1F5] text-center font-normal">Платеж<br/>по QR</span>
            </button>
          </div>

          <!-- Peeking Virtual VISA Card (82% width, #F2F2F5 surface) -->
          <div onclick="openCardModal()" class="pressable w-[82%] mx-auto h-[48px] bg-[#F2F2F5] rounded-t-[18px] px-5 pt-3.5 flex items-start justify-between cursor-pointer shadow-md">
            <span class="text-[11.5px] font-medium tracking-[0.06em] text-[#8E8E93] uppercase mt-0.5 leading-none">ВИРТУАЛЬНАЯ</span>
            <!-- Bold Italic Dark-Navy VISA Vector Logo (#1A1F71) -->
            <svg class="h-[18px] w-auto shrink-0" viewBox="0 0 78 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="VISA">
              <path d="M30.6 1.5L26.5 24.5H20.3L24.4 1.5H30.6ZM56.3 16.4L59.6 7.4L61.5 16.4H56.3ZM63.3 24.5H69L64 1.5H58.7C57.5 1.5 56.5 2.2 56.1 3.3L47.2 24.5H53.7L55 20.9H62.9L63.3 24.5ZM47.1 17C47.1 10.9 38.7 10.6 38.8 7.9C38.8 7.1 39.6 6.2 41.3 6C42.2 5.9 44.5 5.8 47.2 7L48.3 2.1C46.8 1.6 44.9 1.1 42.5 1.1C36.4 1.1 32.1 4.4 32.1 9C32 12.4 35.2 14.3 37.6 15.5C40 16.7 40.8 17.5 40.8 18.5C40.8 20.1 38.9 20.8 37.1 20.8C34 20.8 32.2 20 30.8 19.3L29.7 24.4C31.1 25.1 33.8 25.6 36.6 25.6C43.1 25.6 47.1 22.4 47.1 17ZM19.9 1.5L10.1 24.5H3.5L-1.3 6.1C-1.6 4.9 -1.9 4.5 -2.8 4C-4.3 3.2 -6.8 2.4 -9 2L-8.8 1.5H1.7C3.1 1.5 4.3 2.4 4.6 4L7.2 17.8L13.7 1.5H19.9Z" transform="translate(9, 0)" fill="#1A1F71"/>
            </svg>
          </div>
        </div>
      </section>

      <!-- Dark Bottom Sheet: Transaction History Feed -->
      <section class="flex-1 bg-[#1C1B1F] rounded-t-[26px] flex flex-col overflow-hidden relative z-20 shadow-[0_-8px_30px_rgba(0,0,0,0.45)]">
        <!-- Sticky Top Section Bar ('СЕГОДНЯ, 17,00 с̲' + Analytics + Search) -->
        <div class="px-5 pt-4 pb-2 shrink-0 bg-[#1C1B1F] z-10">
          <div class="flex items-center justify-between">
            <div id="todayHeaderLabel" class="text-[12.5px] font-medium tracking-[0.03em] text-[#88868E] uppercase">
              СЕГОДНЯ, 17,00 <span class="som-sm">С</span>
            </div>
            <div class="flex items-center gap-4 text-[#7E7C84]">
              <!-- Analytics Bar Icon (short, tallest, medium, short-medium) -->
              <button onclick="openAnalyticsModal()" class="pressable p-1 hover:text-white transition-colors" title="Аналитика расходов">
                <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="3" y="13" width="2.4" height="7" rx="1.2"/>
                  <rect x="8.5" y="4" width="2.4" height="16" rx="1.2"/>
                  <rect x="14" y="8" width="2.4" height="12" rx="1.2"/>
                  <rect x="19.5" y="11" width="2.4" height="9" rx="1.2"/>
                </svg>
              </button>
              <!-- Search Magnifying Glass Icon -->
              <button onclick="toggleSearchBar()" class="pressable p-1 hover:text-white transition-colors" title="Поиск по операциям">
                <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="10.8" cy="10.8" r="6.8"/>
                  <path d="M16 16l4.2 4.2"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Collapsible Live Search Input -->
          <div id="searchBarContainer" class="hidden mt-2.5">
            <div class="relative flex items-center">
              <input
                id="transactionSearchInput"
                type="text"
                placeholder="Поиск по названию, категории или сумме..."
                oninput="renderTransactions()"
                class="w-full bg-[#2A2930] text-[14px] text-white placeholder-[#8A8990] rounded-xl pl-3.5 pr-9 py-2.5 outline-none border border-white/10 focus:border-[#9580E8]"
              />
              <button onclick="clearSearch()" class="absolute right-2.5 text-[#8A8990] hover:text-white p-1">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Scrollable Transaction List -->
        <div id="transactionScrollList" class="flex-1 overflow-y-auto no-scrollbar px-5 pb-28">
          <!-- Transactions injected dynamically by JS -->
        </div>
      </section>
    </main>

    <!-- ==================== OTHER TABS VIEW (Платежи / Кредиты / Накопления / Ещё) ==================== -->
    <section id="secondaryTabContent" class="hidden flex-1 flex-col overflow-hidden bg-[#09080C]">
      <!-- Rendered dynamically when switching bottom tabs -->
    </section>

    <!-- ==================== FLOATING PILL BOTTOM NAVIGATION BAR ==================== -->
    <div id="bottomNavWrapper" class="absolute bottom-7 left-0 right-0 px-4 z-30 pointer-events-none">
      <nav class="floating-nav rounded-full p-1.5 flex items-center justify-between pointer-events-auto">
        <!-- Tab 1: Главная (Solid house with pitched roof & doorway cutout) -->
        <button onclick="switchBottomTab('home')" data-tab="home" class="nav-btn nav-pill-active flex-1 py-1.5 px-1 rounded-full flex flex-col items-center justify-center gap-0.5 text-[#9E8DF2] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3.2L3.5 10.3c-.3.25-.5.63-.5 1.03V19.5A1.5 1.5 0 004.5 21h4.75v-5.25a1.25 1.25 0 011.25-1.25h3a1.25 1.25 0 011.25 1.25V21h4.75a1.5 1.5 0 001.5-1.5v-8.17c0-.4-.2-.78-.5-1.03L12 3.2z"/>
          </svg>
          <span class="text-[10px] font-medium leading-tight">Главная</span>
        </button>

        <!-- Tab 2: Платежи (Solid white wallet with right-side clasp notch and dark dot) -->
        <button onclick="switchBottomTab('payments')" data-tab="payments" class="nav-btn flex-1 py-1.5 px-1 rounded-full flex flex-col items-center justify-center gap-0.5 text-[#F2F2F5] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M5.5 4.5h11A2.5 2.5 0 0119 7v.5H5.5a1 1 0 010-2H17V5H5.5a2.5 2.5 0 00-2.5 2.5v9A2.5 2.5 0 005.5 19h13a2.5 2.5 0 002.5-2.5v-6A2.5 2.5 0 0018.5 8h-13A2.5 2.5 0 013 5.5v2A2.5 2.5 0 015.5 4.5zm11.25 7.25a1.25 1.25 0 100 2.5h2.75v-2.5h-2.75z"/>
          </svg>
          <span class="text-[10px] font-medium leading-tight">Платежи</span>
        </button>

        <!-- Tab 3: Кредиты (Solid white circle with top-right 90° wedge 12-to-3 o'clock cut out) -->
        <button onclick="switchBottomTab('credits')" data-tab="credits" class="nav-btn flex-1 py-1.5 px-1 rounded-full flex flex-col items-center justify-center gap-0.5 text-[#F2F2F5] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3.5a8.5 8.5 0 108.5 8.5H12V3.5z"/>
          </svg>
          <span class="text-[10px] font-medium leading-tight">Кредиты</span>
        </button>

        <!-- Tab 4: Накопле... (Solid white rounded-square safe with central dark ring dial & two bottom feet) -->
        <button onclick="switchBottomTab('savings')" data-tab="savings" class="nav-btn flex-1 py-1.5 px-1 rounded-full flex flex-col items-center justify-center gap-0.5 text-[#F2F2F5] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M6.5 4h11A2.5 2.5 0 0120 6.5v10a2.5 2.5 0 01-2.5 2.5H17v1.2a.8.8 0 01-1.6 0V19H8.6v1.2a.8.8 0 01-1.6 0V19h-.5A2.5 2.5 0 014 16.5v-10A2.5 2.5 0 016.5 4zm5.5 4.2a3.3 3.3 0 100 6.6 3.3 3.3 0 000-6.6zm0 1.8a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
          </svg>
          <span class="text-[10px] font-medium leading-tight">Накопле...</span>
        </button>

        <!-- Tab 5: Ещё (3 stacked horizontal rounded bars ≡) -->
        <button onclick="switchBottomTab('more')" data-tab="more" class="nav-btn flex-1 py-1.5 px-1 rounded-full flex flex-col items-center justify-center gap-0.5 text-[#F2F2F5] transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M4.5 7.5h15M4.5 12h11.5M4.5 16.5h8"/>
          </svg>
          <span class="text-[10px] font-medium leading-tight">Ещё</span>
        </button>
      </nav>
    </div>

    <!-- ==================== TRANSACTION DETAIL / RECEIPT SCREEN ==================== -->
    <div id="detailScreen" class="detail-screen">
      <!-- Top Bar with Lavender Back Arrow & Subtle Quick-Switcher -->
      <div class="px-4 pt-4 pb-1 flex items-center justify-between shrink-0 bg-[#0B0B0D]">
        <button onclick="closeTransactionDetail()" class="pressable p-2 -ml-1 text-[#9E8DF2] rounded-full hover:bg-white/5" aria-label="Назад">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 18l-6-6 6-6"/>
          </svg>
        </button>

        <!-- Subtle Quick-Switcher between Home and Yandex Go Receipts -->
        <div class="flex items-center gap-1 bg-[#1C1B1F]/90 border border-white/[0.08] rounded-full p-0.5 text-[11px]">
          <button onclick="closeTransactionDetail()" class="pressable px-2.5 py-1 rounded-full text-[#88868E] hover:text-white transition-colors">
            Главная
          </button>
          <button id="quickSwitch497" onclick="openTransactionDetail('tx-yest-5')" class="pressable px-2.5 py-1 rounded-full text-[#88868E] hover:text-white transition-colors">
            -497 <span class="som-sm">с</span>
          </button>
          <button id="quickSwitch263" onclick="openTransactionDetail('tx-yest-6')" class="pressable px-2.5 py-1 rounded-full text-[#88868E] hover:text-white transition-colors">
            -263 <span class="som-sm">с</span>
          </button>
        </div>
      </div>

      <!-- Scrollable Receipt Container -->
      <div id="detailScrollBody" class="flex-1 overflow-y-auto no-scrollbar relative pt-8">
        <!-- Overlapping 68px Circular Merchant Icon -->
        <div id="detailMerchantLogo" class="w-[68px] h-[68px] rounded-full mx-auto relative z-20 shadow-lg flex items-center justify-center overflow-hidden">
          <!-- Injected dynamically -->
        </div>

    // ==================== FORMATTING HELPERS ====================
    function formatNumberParts(value) {
      const abs = Math.abs(value);
      const fixed = abs.toFixed(2);
      const [intRaw, fracRaw] = fixed.split('.');
      const intFormatted = intRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return {
        sign: value < 0 ? '-' : '',
        int: intFormatted,
        frac: ',' + fracRaw
      };
    }

    function formatSomInline(value) {
      const parts = formatNumberParts(value);
      return `${parts.sign}${parts.int}${parts.frac} <span class="som-sm">с</span>`;

          tx.subtitle.toLowerCase().includes(query) ||
          (tx.bankName && tx.bankName.toLowerCase().includes(query)) ||
          Math.abs(tx.amount).toFixed(2).replace('.', ',').includes(query) ||
          (tx.note && tx.note.toLowerCase().includes(query))
        );
      });

      const todayList = filtered.filter(t => t.group === 'today');
      const yesterdayList = filtered.filter(t => t.group === 'yesterday');

      // Update TODAY header total dynamically
      const todaySum = todayList.reduce((acc, t) => acc + (t.amount < 0 ? Math.abs(t.amount) : 0), 0);
      const todayParts = formatNumberParts(todaySum);
      document.getElementById('todayHeaderLabel').innerHTML = `СЕГОДНЯ, ${todayParts.int}${todayParts.frac} <span class="som-sm">С</span>`;

      let html = '';

      if (filtered.length === 0) {
        html = `
          <div class="py-16 text-center text-[#8A8990] text-[14px]">
            Ничего не найдено по запросу «${escapeHtml(query)}»
          </div>
        `;
        container.innerHTML = html;
        return;
      }

      // Today Items
      todayList.forEach(tx => {
        html += renderTransactionRow(tx);
      });

      // Yesterday Section
      if (yesterdayList.length > 0) {
        const yestSum = yesterdayList.reduce((acc, t) => acc + (t.amount < 0 ? Math.abs(t.amount) : 0), 0);
        const yestParts = formatNumberParts(yestSum);
        html += `
          <div class="text-[12.5px] font-medium tracking-[0.03em] text-[#88868E] uppercase mt-6 mb-2">
            ВЧЕРА, ${yestParts.int}${yestParts.frac} <span class="som-sm">С</span>
          </div>
        `;
        yesterdayList.forEach(tx => {
          html += renderTransactionRow(tx);
        });
      }

      container.innerHTML = html;
    }

    function handleAmountInputKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        commitAmountEdit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        if (activeTransaction) renderDetailAmountDisplay(activeTransaction);
      }
    }

    function commitAmountEdit() {
      if (!activeTransaction) return;
      const input = document.getElementById('detailAmountInput');
      if (!input) return;

      let raw = input.value.trim().replace(/\s+/g, '').replace(',', '.');
      let sign = editSignMultiplier;
      if (raw.startsWith('-')) {
        sign = -1;
        raw = raw.slice(1);
      } else if (raw.startsWith('+')) {
        sign = 1;
        raw = raw.slice(1);
      }

      const parsed = parseFloat(raw);
      if (isNaN(parsed) || !isFinite(parsed) || parsed <= 0) {
        showToast('Введите корректную сумму больше 0');
        input.focus();
        return;
      }

      const oldAmount = activeTransaction.amount;
      const newAmount = +(sign * parsed).toFixed(2);
      const delta = +(newAmount - oldAmount).toFixed(2);

      // Update transaction & balances
      activeTransaction.amount = newAmount;
      activeTransaction.balanceAfter = +(activeTransaction.balanceAfter + delta).toFixed(2);
      accounts[2].balance = +(accounts[2].balance + delta).toFixed(2);

      // Persist edited amounts in localStorage
      try {
        const savedEdits = JSON.parse(localStorage.getItem('kg_bank_tx_edits') || '{}');
        savedEdits[activeTransaction.id] = {
          amount: activeTransaction.amount,
          balanceAfter: activeTransaction.balanceAfter
        };
        localStorage.setItem('kg_bank_tx_edits', JSON.stringify(savedEdits));
      } catch (e) {}

      // Sync both the main list, top balance, and detail card UI
      updateBalanceUI();
      renderTransactions();
      openTransactionDetail(activeTransaction.id);

      const formattedParts = formatNumberParts(newAmount);
      showToast(`Сумма обновлена: ${formattedParts.sign}${formattedParts.int}${formattedParts.frac} с`);
    }

      const section = document.getElementById('detailChartSection');
      let startX = 0;
      section.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
      }, { passive: true });
      section.addEventListener('touchend', e => {
        const diff = e.changedTouches[0].clientX - startX;
        if (Math.abs(diff) > 36) {
          if (diff < 0 && currentChartSlide === 0) setChartSlide(1);
          if (diff > 0 && currentChartSlide === 1) setChartSlide(0);
        }
      }, { passive: true });
    })();

    function executeNewTransaction(type) {
      const rawVal = parseFloat(document.getElementById('actionAmountInput')?.value || '0');

        showToast('Введите корректную сумму');
        return;
      }

      const acc = accounts[2];
      if (type !== 'topup' && rawVal > acc.balance) {
        showToast('Недостаточно средств на карте');
        return;
      }

      if (type === 'topup') {
        acc.balance = +(acc.balance + rawVal).toFixed(2);
        transactions.unshift({
          id: 'tx-' + Date.now(),
          group: 'today',
          title: 'Пополнение карты',
          subtitle: 'Перевод с карты другого банка',
          category: 'Пополнение',
          amount: +rawVal.toFixed(2),
          balanceAfter: acc.balance,
          dateTime: '27 ноя 2026, 12:05',

        showToast(`Карта пополнена на ${rawVal.toFixed(2).replace('.', ',')} с`);

    function openModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target === document.getElementById('modalBackdrop')) {
        closeModal();
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-1');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-1');
      }, 2300);
    }

    function copyTextToClipboard(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg || 'Скопировано');
      } catch (e) {
        showToast(successMsg || 'Скопировано');
      }
    }

    function downloadAppHtml() {
      try {
        const clone = document.documentElement.cloneNode(true);
        const mainTab = clone.querySelector('#mainTabContent');
        const secTab = clone.querySelector('#secondaryTabContent');
        const modal = clone.querySelector('#modalBackdrop');
        const detail = clone.querySelector('#detailScreen');

        if (mainTab) mainTab.classList.remove('hidden');
        if (secTab) {
          secTab.classList.add('hidden');
          secTab.classList.remove('flex');
          secTab.innerHTML = '';
        }
        if (modal) modal.classList.remove('open');
        if (detail) detail.classList.remove('open');

        clone.querySelectorAll('.nav-btn').forEach(btn => {
          const isHome = btn.dataset.tab === 'home';
          btn.classList.toggle('nav-pill-active', isHome);
          btn.classList.toggle('text-[#9E8DF2]', isHome);
          btn.classList.toggle('text-[#F2F2F5]', !isHome);
        });

        const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('Файл index.html скачивается');
      } catch (e) {
        showToast('Используйте кнопку скачивания в редакторе справа');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ==================== INIT ====================
    function initApp() {
      updateBalanceUI();
      renderTransactions();
      setupScrollCollapse();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
